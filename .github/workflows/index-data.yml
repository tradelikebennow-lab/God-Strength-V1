# Refreshes daily benchmark closes (SPX, NDX, Gold, BTC) into the Supabase
# index_closes table. Runs weekly after Friday's US close + on demand via
# the Actions tab.
#
# Data source: Yahoo Finance v8 chart API (Stooq blocks GitHub runner IPs).
# Gold uses COMEX futures (GC=F) — Yahoo has no spot XAUUSD series.
#
# Required repo secret (Settings → Secrets and variables → Actions):
#   SUPABASE_SERVICE_ROLE_KEY — the service_role key from Supabase
#   (Project Settings → API Keys → Legacy tab, or a new secret key).
name: Refresh index data

on:
  schedule:
    - cron: '0 22 * * 5' # Friday 22:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Yahoo Finance closes and upsert to Supabase
        env:
          SUPABASE_URL: https://cqpjcpeftfrdwszsvhgj.supabase.co
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 << 'PY'
          import json, os, urllib.request, urllib.parse
          from datetime import datetime, timezone

          SYMBOLS = {'SPX': '^GSPC', 'NDX': '^NDX', 'XAUUSD': 'GC=F', 'BTCUSD': 'BTC-USD'}
          SINCE = '2025-01-01'
          UA = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36'}
          url_base = os.environ['SUPABASE_URL']
          key = os.environ['SERVICE_ROLE_KEY']

          dedup = {}  # (symbol, date) -> row; avoids duplicate-key upsert errors
          for name, ysym in SYMBOLS.items():
              sym = urllib.parse.quote(ysym, safe='')
              url = f'https://query1.finance.yahoo.com/v8/finance/chart/{sym}?interval=1d&range=2y'
              with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30) as r:
                  data = json.load(r)
              result = (data.get('chart', {}).get('result') or [None])[0]
              if not result:
                  print(f'WARNING: {name} ({ysym}) returned no result from Yahoo')
                  continue
              ts = result.get('timestamp', [])
              closes = result['indicators']['quote'][0].get('close', [])
              count = 0
              for t, c in zip(ts, closes):
                  if c is None:
                      continue
                  d = datetime.fromtimestamp(t, tz=timezone.utc).strftime('%Y-%m-%d')
                  if d >= SINCE:
                      dedup[(name, d)] = {'symbol': name, 'date': d, 'close': round(float(c), 4)}
                      count += 1
              print(f'{name}: {count} rows')
              if count == 0:
                  print(f'WARNING: {name} returned no usable rows — check the Yahoo ticker')

          rows = list(dedup.values())
          print(f'parsed {len(rows)} rows total')
          assert rows, 'no rows parsed — Yahoo format change?'

          req = urllib.request.Request(
              f'{url_base}/rest/v1/index_closes?on_conflict=symbol,date',
              data=json.dumps(rows).encode(),
              headers={
                  'apikey': key,
                  'Authorization': f'Bearer {key}',
                  'Content-Type': 'application/json',
                  'Prefer': 'resolution=merge-duplicates',
              },
              method='POST',
          )
          with urllib.request.urlopen(req) as resp:
              print('upsert status', resp.status)
          PY
